; PlatformIO project for ESP32 TB6600 open-drain stepper control
; Demo rotates 360 degrees CW and CCW at 115200 baud

[env:esp32dev]
platform      = espressif32
board         = esp32dev
framework     = arduino
monitor_speed = 460800
monitor_dtr   = 0
monitor_rts   = 0

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -UARDUINO_USB_CDC_ON_BOOT
