<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vision-based Luenberger Observer</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="bg-white">
  <div class="page-wrapper py-5">

    <h1 class="text-center mb-5">Vision-based Luenberger Observer</h1>

    <!-- Stream titles -->
    <div class="row mb-2 text-center">
      <div class="col-6"><h5 class="fw-semibold">Robot Simulation</h5></div>
      <div class="col-6"><h5 class="fw-semibold">Robot-facing Camera</h5></div>
    </div>

    <!-- Streams -->
    <div class="row mb-5">
      <div class="col-6 d-flex justify-content-center align-items-start">
        <img id="rgbStream" src="/stream/rgb" alt="Gym RGB render">
      </div>
      <div class="col-6" style="padding-bottom: 8%; display: flex; align-items: flex-end;">
        <img id="binaryStream" src="/stream/binary" alt="Binary observation">
      </div>
    </div>

    <!-- State titles -->
    <div class="row mb-2 text-center">
      <div class="col-6"><h5 class="fw-semibold">Ground Truth</h5></div>
      <div class="col-6"><h5 class="fw-semibold">Estimated States</h5></div>
    </div>

    <!-- States -->
    <div class="row mb-5">
      <div class="col-6 d-flex justify-content-center">
        <dl id="groundTruthState" class="state-grid"></dl>
      </div>
      <div class="col-6 d-flex justify-content-center">
        <dl id="estimatedState" class="state-grid"></dl>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls-center text-center">
      <div class="mb-3 text-start">
        <label for="angleSlider" class="form-label">
          Pole angle &mdash; <span id="angleValue">12.0</span>&deg;
        </label>
        <input type="range" class="form-range" id="angleSlider"
               min="-12" max="12" step="0.1" value="12">
      </div>

      <div class="mb-4 text-start">
        <label for="posSlider" class="form-label">
          Cart position &mdash; <span id="posValue">0.00</span> m
        </label>
        <input type="range" class="form-range" id="posSlider"
               min="-0.18" max="0.18" step="0.01" value="0">
      </div>

      <div class="d-flex justify-content-center gap-3">
        <button id="startButton" type="button" class="btn btn-primary px-5">Start</button>
        <button id="resetButton" type="button" class="btn btn-outline-secondary px-5">Reset</button>
      </div>
    </div>

  </div>
  <script src="/static/app.js"></script>
</body>
</html>
